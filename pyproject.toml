[project]
name = "scifi"
version = "1.7.5"
description = "Analyse van alle boeken van de enige echte Sci-Fi Boekenclub."
authors = [
    { name = "Thomas Brouwer", email = "brouwer.thomas@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.19",  # emSign CA compromise, Oct 2026
    "plotly>=6.2.0",
    "polars>=2.0",
    "streamlit>=1.59",
]

[dependency-groups]
dev = [
    "prek>=0.5.7",  # emSign CA compromise, Oct 2026
    "pydoclint>=0.6.6",
    "pytest-cov>=6.2.1",
    "pytest>=9.0.3",
    "ruff>=0.12.7",
    "ty>=0.0.84",
    "watchdog>=6.0.0",
]
notebooks = [
    "ipykernel>=6.30.0",
    "matplotlib>=3.10.5",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.4"  # emSign CA compromise, Oct 2026
default-groups = ["dev", "notebooks"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
pydocstyle.convention = "numpy"
ignore = [
    "COM812",   # Trailing commas: the formatter owns this.
    "ISC001",   # Implicit string concatenation: same.
    "DTZ011",   # date.today() decides whether a meeting is in the past; no timezone needed.
]
unfixable = [
    "F401",     # Unused import: the hooks run `ruff --fix`, and an import not used yet must not vanish on commit.
]

[tool.ruff.lint.per-file-ignores]
"books/**/*.ipynb" = [
    "ANN001",   # Missing type annotation for function argument: exploratory notebooks.
    "ANN201",   # Missing return type annotation for public function: same.
    "E501",     # Line too long: formulas and their comments.
    "N803",     # Argument name should be lowercase: physics notation, e.g. D for distance.
    "N816",     # Variable in global scope should not be mixedCase: physics notation, e.g. log10_M.
    "RUF001",   # String contains ambiguous unicode character: Greek letters such as γ are intentional.
    "T201",     # print found: a notebook prints its results.
]
"tests/*.py" = [
    "PLR2004",  # Magic value used in comparison: literal expected values.
    "S101",     # Use of assert: pytest asserts.
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.pydoclint]
style = "numpy"
exclude = ".git|.venv|scratch"
