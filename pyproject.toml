[project]
name = "scifi"
version = "1.7.2"
description = "Analyse van alle boeken van de enige echte Sci-Fi Boekenclub."
authors = [
    { name = "Thomas Brouwer", email = "brouwer.thomas@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "plotly>=6.2.0",
    "polars>=2.0",
    "streamlit>=1.59",
]

[dependency-groups]
dev = [
    "prek>=0.2.27",
    "pydoclint>=0.6.6",
    "pytest-cov>=6.2.1",
    "pytest>=9.0.3",
    "ruff>=0.12.7",
    "ty>=0.0.84",
    "watchdog>=6.0.0",
]
notebooks = [
    "ipykernel>=6.30.0",
    "matplotlib>=3.10.5",
    "nbformat>=5.10.4",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "notebooks"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
pydocstyle.convention = "numpy"
ignore = [
    "COM812",   # Trailing commas: the formatter owns this.
    "ISC001",   # Implicit string concatenation: same.
    "DTZ011",   # date.today() decides whether a meeting is in the past; no timezone needed.
    "E501",     # Three inline-HTML lines in ui/overview.py; drop together with the native cards.
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "PLR2004", "T201"]                               # Notebooks print and compare literals.
"books/**/*.ipynb" = ["ANN001", "ANN201", "N803", "N816", "RUF001"]  # Physics notation (D, log10_M, γ).
"src/scifi/data_processor.py" = ["T201"]                              # print is the output of `python -m scifi.data_processor`.
"tests/*.py" = ["PLR2004", "S101"]                                    # Literal expected values and bare asserts.

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.pydoclint]
style = "numpy"
exclude = ".git|.venv|scratch"
