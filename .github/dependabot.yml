version: 2
updates:
  # Version updates disabled (open-pull-requests-limit: 0).
  # Dependabot security updates can still open PRs for vulnerable packages.
  - package-ecosystem: github-actions
    directory: .
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-deps:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: .
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
